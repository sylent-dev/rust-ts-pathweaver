  The mock-up of Pathweaver (html-mockups skill), from the wireframes of docs/wireframes/.
  This page only loads the small files of pathweaver/, in order: the styles (the page, the
  tokens of each style and the second accent, then one sheet per block, the texture last),
  the scripts (the page and its controls, the shared helpers, the sample data, one script per
  block), the sections, and the rendering last.
  Plain tags, no modules, so that the files share their constants.

  Serve the repository root without cache, on the port of the project:
    python3 docs/mockups/serve.py 8796
  then open http://127.0.0.1:8796/docs/mockups/pathweaver.html
-->
